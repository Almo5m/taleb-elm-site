<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://nokgvbmngcgkfjlcmvmd.supabase.co; base-uri 'none'; form-action 'none'">
<title>قيّم طالب علم</title>
<meta name="description" content="شاركنا رأيك في تطبيق طالب علم">
<link rel="icon" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script src="assets/js/theme.js"></script>
<link rel="stylesheet" href="assets/css/rate.css">
</head>
<body>

<main class="card" id="formCard">
  <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8 6 18M18 6l1.8-1.8"/></svg><svg viewBox="0 0 24 24" class="i-moon"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg></button>
  <div class="icon-badge"><img src="assets/app-icon.png" alt="طالب علم"></div>
  <h1>إيه رأيك في طالب علم؟</h1>
  <p class="sub">دقيقة واحدة بس — رأيك بيساعد طلاب تانيين يعرفوا التطبيق أحسن.</p>

  <form id="rateForm">
    <input type="text" name="website" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="star-picker" id="starPicker" role="group" aria-label="تقييمك بالنجوم">
      <button type="button" data-star="5" aria-label="5 نجوم" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.2 1 5.9L12 17l-5.2 2.8 1-5.9-4.3-4.2 5.9-.8L12 3.5Z"/></svg></button>
      <button type="button" data-star="4" aria-label="4 نجوم" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.2 1 5.9L12 17l-5.2 2.8 1-5.9-4.3-4.2 5.9-.8L12 3.5Z"/></svg></button>
      <button type="button" data-star="3" aria-label="3 نجوم" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.2 1 5.9L12 17l-5.2 2.8 1-5.9-4.3-4.2 5.9-.8L12 3.5Z"/></svg></button>
      <button type="button" data-star="2" aria-label="نجمتين" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.2 1 5.9L12 17l-5.2 2.8 1-5.9-4.3-4.2 5.9-.8L12 3.5Z"/></svg></button>
      <button type="button" data-star="1" aria-label="نجمة واحدة" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.2 1 5.9L12 17l-5.2 2.8 1-5.9-4.3-4.2 5.9-.8L12 3.5Z"/></svg></button>
      </div>
    <div class="star-label" id="starLabel" aria-live="polite">&nbsp;</div>

    <div class="row">
      <label for="rName">اسمك</label>
      <input type="text" id="rName" maxlength="60" placeholder="اسمك اللي هيظهر مع التقييم" required>
    </div>
    <div class="row">
      <label for="rComment">تعليقك (اختياري)</label>
      <textarea id="rComment" maxlength="500" rows="3" placeholder="إيه اللي عجبك أو ممكن نحسّنه؟"></textarea>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn"><span id="submitText">إرسال التقييم</span></button>
    <div class="status" id="status" role="alert"></div>
  </form>
</main>

<div class="card" id="thanks" role="status">
  <div class="big-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg></div>
  <h1>شكرًا على وقتك!</h1>
  <p class="sub">تقييمك هيظهر للطلاب التانيين بعد مراجعة بسيطة.</p>
  <a class="dl-link" href="https://almo5m.github.io/taleb-elm-site/" target="_blank" rel="noopener noreferrer">ارجع لموقع طالب علم</a>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/rate.js"></script>
</body>
</html>
